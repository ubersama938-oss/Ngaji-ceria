name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Remove old android folder
        run: rm -rf android

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Android app icons
        run: |
          ICON=www/assets/images/icon-512.png
          RES=android/app/src/main/res
          if [ -f "$ICON" ]; then
            magick "$ICON" -resize 48x48 "$RES/mipmap-mdpi/ic_launcher.png"
            magick "$ICON" -resize 72x72 "$RES/mipmap-hdpi/ic_launcher.png"
            magick "$ICON" -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher.png"
            magick "$ICON" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
            magick "$ICON" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
            echo "✅ Icons generated successfully"
          else
            echo "⚠️ icon-512.png not found, skipping"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ngaji-Ceria-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
