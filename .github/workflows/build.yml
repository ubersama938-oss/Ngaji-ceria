name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Remove old android folder
        run: rm -rf android

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Debug - Cek icon & folder mipmap
        run: |
          echo "=== Cek icon ==="
          ls -lh www/assets/images/icon-512.png || echo "❌ Icon NOT FOUND"
          echo ""
          echo "=== Cek folder mipmap ==="
          ls android/app/src/main/res/ | grep mipmap

      - name: Generate Android app icons
        run: |
          set -e
          ICON=www/assets/images/icon-512.png
          RES=android/app/src/main/res
          
          if [ ! -f "$ICON" ]; then
            echo "❌ Icon not found at $ICON"
            exit 1
          fi
          
          echo "✅ Icon found: $(ls -lh $ICON)"
          
          # Ukuran per dpi
          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            FOLDER="$RES/mipmap-$dpi"
            SIZE=${SIZES[$dpi]}
            
            if [ ! -d "$FOLDER" ]; then
              echo "❌ Folder $FOLDER not found, skipping"
              continue
            fi
            
            echo "Generating $dpi ($SIZE x $SIZE)..."
            
            # Replace ic_launcher.png
            convert "$ICON" -resize ${SIZE}x${SIZE} "$FOLDER/ic_launcher.png"
            echo "  ✅ ic_launcher.png"
            
            # Replace ic_launcher_round.png if exists
            if [ -f "$FOLDER/ic_launcher_round.png" ]; then
              convert "$ICON" -resize ${SIZE}x${SIZE} "$FOLDER/ic_launcher_round.png"
              echo "  ✅ ic_launcher_round.png"
            fi
            
            # Replace ic_launcher_foreground.png if exists
            if [ -f "$FOLDER/ic_launcher_foreground.png" ]; then
              FG=$((SIZE * 2))
              convert "$ICON" -resize ${FG}x${FG} "$FOLDER/ic_launcher_foreground.png"
              echo "  ✅ ic_launcher_foreground.png ($FG x $FG)"
            fi
          done
          
          echo ""
          echo "=== Result ==="
          ls -lh $RES/mipmap-xxxhdpi/
          echo "✅ All icons generated successfully"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ngaji-Ceria-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
