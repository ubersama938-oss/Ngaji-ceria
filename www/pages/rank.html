<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peringkat - Ngaji Ceria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/rank-profil.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-rank">

    <header class="page-header-simple">
        <button class="btn-back" onclick="goBack()">←</button>
        <h2>🏆 Peringkat</h2>
        <div style="width: 40px;"></div>
    </header>

    <section class="podium">
        <div class="podium-item second">
            <div class="podium-avatar">🧕</div>
            <div class="podium-name">Aisyah</div>
            <div class="podium-block silver"><span class="podium-rank">2</span></div>
            <div class="podium-points">🪙 285</div>
        </div>
        <div class="podium-item first">
            <div class="crown">👑</div>
            <div class="podium-avatar">👦</div>
            <div class="podium-name">Ahmad</div>
            <div class="podium-block gold"><span class="podium-rank">1</span></div>
            <div class="podium-points">🪙 350</div>
        </div>
        <div class="podium-item third">
            <div class="podium-avatar">👧</div>
            <div class="podium-name">Fatimah</div>
            <div class="podium-block bronze"><span class="podium-rank">3</span></div>
            <div class="podium-points">🪙 220</div>
        </div>
    </section>

    <section class="rank-list">
        <div class="rank-item highlight">
            <div class="rank-num">4</div>
            <div class="rank-avatar">👦</div>
            <div class="rank-info">
                <div class="rank-name">Kamu (Ananda Ahmad)</div>
                <div class="rank-sub">Level 3 • 2 bintang</div>
            </div>
            <div class="rank-points">🪙 350</div>
        </div>
        <div class="rank-item">
            <div class="rank-num">5</div>
            <div class="rank-avatar">👦</div>
            <div class="rank-info"><div class="rank-name">Umar</div><div class="rank-sub">Level 2 • 5 bintang</div></div>
            <div class="rank-points">🪙 180</div>
        </div>
        <div class="rank-item">
            <div class="rank-num">6</div>
            <div class="rank-avatar">🧕</div>
            <div class="rank-info"><div class="rank-name">Khadijah</div><div class="rank-sub">Level 2 • 4 bintang</div></div>
            <div class="rank-points">🪙 165</div>
        </div>
        <div class="rank-item">
            <div class="rank-num">7</div>
            <div class="rank-avatar">👧</div>
            <div class="rank-info"><div class="rank-name">Maryam</div><div class="rank-sub">Level 1 • 6 bintang</div></div>
            <div class="rank-points">🪙 120</div>
        </div>
        <div class="rank-item">
            <div class="rank-num">8</div>
            <div class="rank-avatar">👦</div>
            <div class="rank-info"><div class="rank-name">Yusuf</div><div class="rank-sub">Level 1 • 2 bintang</div></div>
            <div class="rank-points">🪙 85</div>
        </div>
    </section>

    <script src="../js/app.js"></script>
    <script>
        function goBack() {
            if (navigator.vibrate) navigator.vibrate(30);
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
